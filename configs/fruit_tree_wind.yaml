# Paper's fruit tree on the analytic arm, but the branches swing in the wind (+-10 deg, 3 s)
# and the fruit sways with its branch; the state carries obstacle/target velocities (45-D).
seed: 0
arm:
  d1: 0.15
  a2: 0.26
  a3: 0.23
  d4: 0.1
  d5: 0.08
  d6: 0.0782
  link_radius: 0.04
  joint_limits_deg: 170.0
  home_deg:
  - 0.0
  - 90.0
  - -135.0
  - 45.0
  - 90.0
  - 0.0
scene:
  obstacle_radius: 0.04
  target_radius: 0.03
  tree_position:
  - 0.65
  - 0.0
  - 0.0
  trunk_height: 0.9
  branch_heights:
  - 0.2
  - 0.3
  - 0.4
  - 0.48
  branch_length_range:
  - 0.15
  - 0.28
  branch_elevation_deg:
  - 10.0
  - 40.0
  obstacle_pose_noise: 0.1
  target_noise: 0.05
  min_target_reach: 0.2
  max_target_reach: 0.58
  floor_collision: true
  wind:
    amplitude_deg: 10.0
    period: 3.0
env:
  max_steps: 100
  max_delta_deg: 5.0
  reach_threshold: 0.03
  distance_scale: 10.0
  collision_penalty: -50.0
  collision_mode: terminate
  monitored_links:
  - 1
  - 2
  - 3
  - 4
  - 5
  normalize_angles: false
  include_velocities: true
ddpg:
  hidden_sizes:
  - 128
  - 128
  actor_lr: 1.0e-05
  critic_lr: 0.0001
  gamma: 0.95
  tau: 0.005
  weight_decay: 0.0001
  buffer_size: 100000
  batch_size: 64
  warmup_steps: 1000
  action_noise_deg_start: 2.0
  action_noise_deg_end: 0.0
  grad_clip: 1.0
train:
  episodes: 10000
  log_every: 50
  checkpoint_every: 250
  viewer_episodes: 4
  reward_curve_bin: 100
eval:
  episodes: 1000
  rrt:
    step_deg: 5.0
    goal_bias: 0.1
    max_iter: 3000
    max_time_s: 10.0
    goal_tol: 0.03
